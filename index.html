<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Blitz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 32px 0;
      background: #f5deb3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ─── App wrapper ─── */
    #app-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* When game is active: unified drop-shadow over the whole panel+calculator stack */
    #app-wrapper.game-active {
      filter: drop-shadow(0 24px 48px rgba(61,43,31,0.28));
    }
    #app-wrapper.game-active .calculator {
      box-shadow: none;
      border-radius: 0 0 24px 24px;
    }
    #app-wrapper.game-active #game-panel {
      box-shadow: none;
    }

    /* ─── Game panel ─── */
    #game-panel {
      width: 380px;
      background: #d4956a;
      border-radius: 24px 24px 0 0;
      padding: 20px 24px 18px;
      box-shadow: 0 8px 24px rgba(61,43,31,0.2);
    }

    .game-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      min-width: 90px;
      gap: 2px;
    }

    .score-meta {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #3d2b1f;
      opacity: 0.45;
      text-transform: uppercase;
    }

    #score-display {
      font-size: 34px;
      font-weight: 700;
      color: #3d2b1f;
      line-height: 1;
    }

    #streak-display {
      font-size: 14px;
      font-weight: 600;
      color: #3d2b1f;
      min-height: 20px;
      transition: transform 0.2s;
    }

    .difficulty-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #3d2b1f;
      opacity: 0.5;
      text-transform: uppercase;
      background: rgba(61,43,31,0.08);
      padding: 5px 12px;
      border-radius: 20px;
    }

    .timer-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    #timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #3d2b1f;
      pointer-events: none;
    }

    .timer-warning {
      animation: timerPulse 0.4s ease-in-out infinite alternate;
      color: #f44336 !important;
    }

    .question-text {
      font-size: 30px;
      font-weight: 500;
      color: #3d2b1f;
      text-align: center;
      min-height: 42px;
      letter-spacing: 0.5px;
      padding: 4px 0;
    }

    #feedback-flash {
      min-height: 30px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      opacity: 0;
      margin-top: 6px;
    }

    .feedback-correct { color: #3a9e4d; }
    .feedback-wrong   { color: #e63946; }
    .feedback-correct.feedback-animate { animation: feedbackUp    0.7s ease-out forwards; }
    .feedback-wrong.feedback-animate   { animation: feedbackShake 0.7s ease-out forwards; }

    /* ─── Result view (replaces playing view inside game panel) ─── */
    #result-view {
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 0 8px;
      text-align: center;
    }

    #result-title { font-size: 22px; font-weight: 700; color: #1c2838; }
    #result-score { font-size: 60px; font-weight: 300; color: #1c2838; line-height: 1; }
    #result-stats {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: #3d2b1f;
      opacity: 0.7;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ─── Calculator ─── */
    .calculator {
      background: #d4956a;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(61,43,31,0.25);
      width: 380px;
    }

    #display {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #3d2b1f;
      font-size: 52px;
      font-weight: 300;
      text-align: right;
      padding: 12px 8px 22px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 50%;
      width: 72px;
      height: 72px;
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      filter: brightness(1.3);
      transform: scale(0.95);
    }

    .btn-function { background: #f5e0c8; color: #3d2b1f; }
    .btn-operator { background: #3d2b1f; color: #f5deb3; }
    .btn-number   { background: #faf0e6; color: #3d2b1f; }
    .btn-equals   { background: #3d2b1f; color: #f5deb3; }

    .btn-zero {
      grid-column: span 2;
      border-radius: 36px;
      width: 100%;
      justify-content: flex-start;
      padding-left: 28px;
    }

    .btn-wide {
      grid-column: span 4;
      border-radius: 36px;
      width: 100%;
    }

    .btn-exp {
      background: linear-gradient(135deg, #c0392b 0%, #e67e22 50%, #f39c12 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(192, 57, 43, 0.5);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.1s, filter 0.2s;
    }

    .btn-exp::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
      border-radius: inherit;
      pointer-events: none;
    }

    .btn-exp:hover {
      box-shadow: 0 6px 30px rgba(192, 57, 43, 0.7), 0 0 24px rgba(243, 156, 18, 0.4);
      filter: brightness(1.1);
    }

    .btn-exp:active {
      filter: brightness(1.3);
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(192, 57, 43, 0.5);
    }

    /* ─── Game footer ─── */
    .game-footer {
      width: 380px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    #difficulty-select {
      flex: 1;
      padding: 11px 16px;
      border-radius: 22px;
      border: none;
      background: #d4956a;
      color: #3d2b1f;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    #start-btn {
      padding: 11px 22px;
      border-radius: 22px;
      border: none;
      background: #3d2b1f;
      color: #f5deb3;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
      white-space: nowrap;
      min-width: 110px;
      text-align: center;
    }

    #start-btn:active {
      filter: brightness(1.3);
      transform: scale(0.97);
    }

    #highscore-display {
      font-size: 12px;
      color: #3d2b1f;
      opacity: 0.55;
      white-space: nowrap;
      min-width: 62px;
      text-align: right;
    }

    /* ─── Countdown overlay ─── */
    #countdown-overlay {
      position: fixed;
      inset: 0;
      background: rgba(61, 43, 31, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      font-weight: 800;
      color: #faf0e6;
      z-index: 100;
    }

    .countdown-pop {
      animation: countdownPop 0.65s ease-out;
    }

    /* ─── Keyframes ─── */
    @keyframes feedbackUp {
      0%   { opacity: 1; transform: translateY(0); }
      70%  { opacity: 1; transform: translateY(-14px); }
      100% { opacity: 0; transform: translateY(-22px); }
    }

    @keyframes feedbackShake {
      0%   { opacity: 1; transform: translateX(0); }
      15%  { transform: translateX(-8px); }
      30%  { transform: translateX(8px); }
      45%  { transform: translateX(-5px); }
      60%  { transform: translateX(5px); }
      75%  { transform: translateX(0); }
      90%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes timerPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.2); }
    }

    @keyframes countdownPop {
      0%   { opacity: 0; transform: scale(2.2); }
      25%  { opacity: 1; transform: scale(1); }
      75%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.7); }
    }
  </style>
</head>
<body>
  <div id="app-wrapper">

    <!-- Game panel: shown during play and on result screen -->
    <div id="game-panel" style="display:none">

      <!-- Playing view: HUD + question -->
      <div id="playing-view">
        <div class="game-hud">

          <div class="hud-left">
            <div class="score-meta">Score</div>
            <div id="score-display">0</div>
            <div id="streak-display"></div>
          </div>

          <div id="difficulty-badge" class="difficulty-badge">EASY</div>

          <div class="timer-wrap">
            <svg width="52" height="52" viewBox="0 0 52 52">
              <circle cx="26" cy="26" r="22" fill="none" stroke="#3d2b1f" stroke-width="4" opacity="0.12"/>
              <circle id="timer-ring" cx="26" cy="26" r="22" fill="none"
                stroke="#4CAF50" stroke-width="4"
                stroke-dasharray="138.23" stroke-dashoffset="0"
                stroke-linecap="round"
                transform="rotate(-90 26 26)"/>
            </svg>
            <span id="timer-text">60</span>
          </div>

        </div>
        <div id="question-text" class="question-text">Get ready...</div>
        <div id="feedback-flash"></div>
      </div>

      <!-- Result view: shown after game ends -->
      <div id="result-view" style="display:none">
        <div id="result-title"></div>
        <div id="result-score"></div>
        <div id="result-stats"></div>
      </div>

    </div>

    <!-- Calculator -->
    <div class="calculator">
      <input id="display" type="text" readonly value="0" />
      <div class="buttons">
        <button class="btn-function" data-action="clear">AC</button>
        <button class="btn-function" data-action="sign">+/-</button>
        <button class="btn-function" data-action="percent">%</button>
        <button class="btn-operator" data-action="operator" data-value="/">÷</button>

        <button class="btn-number" data-action="digit" data-value="7">7</button>
        <button class="btn-number" data-action="digit" data-value="8">8</button>
        <button class="btn-number" data-action="digit" data-value="9">9</button>
        <button class="btn-operator" data-action="operator" data-value="*">×</button>

        <button class="btn-number" data-action="digit" data-value="4">4</button>
        <button class="btn-number" data-action="digit" data-value="5">5</button>
        <button class="btn-number" data-action="digit" data-value="6">6</button>
        <button class="btn-operator" data-action="operator" data-value="-">−</button>

        <button class="btn-number" data-action="digit" data-value="1">1</button>
        <button class="btn-number" data-action="digit" data-value="2">2</button>
        <button class="btn-number" data-action="digit" data-value="3">3</button>
        <button class="btn-operator" data-action="operator" data-value="+">+</button>

        <button class="btn-number btn-zero" data-action="digit" data-value="0">0</button>
        <button class="btn-number" data-action="dot">.</button>
        <button class="btn-equals" data-action="equals">=</button>

        <button class="btn-exp btn-wide" data-action="operator" data-value="^">x<sup style="font-size:12px;vertical-align:super;opacity:0.85">y</sup>&thinsp;Power</button>
      </div>
    </div>

    <!-- Game footer: difficulty selector + start button -->
    <div class="game-footer">
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="nightmare">Nightmare 💀</option>
      </select>
      <button id="start-btn">▶ Start</button>
      <span id="highscore-display"></span>
    </div>

  </div>

  <!-- Countdown overlay (fixed, covers entire screen) -->
  <div id="countdown-overlay"></div>

  <script src="calculator.js"></script>
  <script src="game.js"></script>
</body>
</html>
